<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setlist Builder</title>
<style id="pageStyle">@page{size:letter;margin:0.5in}</style>
<style>
:root{--navy:#2f3a68;--navy2:#43508a;--gold:#d8a656;--orange:#f7913d;--yellow:#fdd352;--bg:#f6f3ec;--card:#fff;--line:#e4dfd3;--line2:#efebe2;--text:#1f2433;--muted:#6f7282;--danger:#b8382b;--ok:#2e7d4f;--warn:#b86e00}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:18px;padding:6px 20px;background:#fff;border-bottom:3px solid var(--yellow);position:sticky;top:0;z-index:5}
header img{height:46px;display:block}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);font-size:17px;min-height:46px}
.dirtyflag{font-size:12px;font-weight:700;color:var(--warn)}
header .hbtn{flex-direction:row;font-size:13px;color:var(--text)}
header .hbtn.primary{color:#fff}
body.welcome nav, body.welcome #dirty, body.welcome #saveBand{display:none}
.welcomebox{max-width:760px;margin:40px auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.welcomebox .card{padding:22px;display:flex;flex-direction:column;gap:10px}
header .appname{font-weight:700;color:var(--navy);font-size:15px;letter-spacing:.02em;margin-right:12px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button:hover{background:var(--line2);color:var(--text)}
nav button.active{background:var(--navy);color:#fff}
main{padding:18px 20px 40px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 14px;color:var(--navy)}
h2{font-size:18px;margin:0 0 14px;color:var(--navy)}
h3{font-size:14px;margin:18px 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9c2b2;background:#fbfaf7}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
textarea{min-height:64px;resize:vertical;width:100%}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
label input,label select{font-size:14px;font-weight:400;color:var(--text)}
label small{font-weight:400}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow,.grow{flex:1}
.muted{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
table.data{width:100%;border-collapse:collapse;background:#fff}
table.data th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff;cursor:pointer;user-select:none;white-space:nowrap}
table.data td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover{background:#fbf7ec}
.tablewrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 190px);background:#fff}
.tag{display:inline-block;background:#fff3cf;color:#7a5600;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600;margin:1px 3px 1px 0}
.badge{display:inline-block;border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}
.badge.mash{background:#e7e9f5;color:var(--navy)}
.badge.warn{background:#fde6c8;color:var(--warn)}
.badge.inset{background:#e2f2e8;color:var(--ok)}
.dot{color:var(--orange);margin-left:6px;font-size:10px;vertical-align:2px}
.blank{color:#c3bdb0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.banner{background:#fde6c8;color:#6b3f00;padding:8px 20px;font-weight:600}

/* Setlists */
.slgrid td.num{text-align:right;font-variant-numeric:tabular-nums}

/* Builder */
.bhead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.bhead .nameinput{font-size:20px;font-weight:700;color:var(--navy);border-color:transparent;background:transparent;padding:4px 8px;width:320px}
.bhead .nameinput:hover{border-color:var(--line)}
.bhead label input{width:100%}
.bhead .w-date{width:150px}.bhead .w-venue{width:180px}.bhead .w-num{width:110px}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:13px}
.summary b{color:var(--navy)}
.voxbal{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:6px;border-top:1px solid var(--line2)}
.voxbal .vbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.vb{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 10px 2px 10px;cursor:pointer;color:var(--text)}
.vb:hover{border-color:#c9c2b2}
.vb.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.vb .vbbar{width:34px;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.vb .vbbar i{display:block;height:100%;background:var(--gold)}
.vb b{min-width:12px;text-align:right}
.over{color:var(--danger);font-weight:700}
.under{color:var(--muted)}
.near{color:var(--ok);font-weight:700}
.builder{display:grid;grid-template-columns:minmax(400px,520px) 1fr;gap:14px;height:calc(100vh - 250px);min-height:420px}
.pane{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
.pane .ptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2)}
.pane .ptools input[type=search]{flex:1;min-width:140px}
.pane .ptitle{font-weight:700;color:var(--navy);margin-right:6px}
.list{flex:1;overflow:auto;min-height:0}
.crow,.chead{display:grid;grid-template-columns:18px minmax(0,1fr) 44px 92px 84px 38px;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;font-size:13px}
.crow:hover{background:#fbf7ec}
.crow.sel{background:#fff1c7}
.crow .ck{width:14px;height:14px;border:1.5px solid #bdb5a3;border-radius:3px;display:inline-block}
.crow.sel .ck{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 2px #fff1c7}
.crow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .tg{display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.crow .tg .tag{margin:0;font-size:10px;padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead{gap:6px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);background:#fbfaf7}
.chead .r{text-align:right}
.crow .s{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .r{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
#sitems{padding:4px 0 30px}
#sitems.drop-end::after{content:"";display:block;height:3px;background:var(--orange);margin:0 10px;border-radius:2px}
.sethead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px 4px;font-weight:800;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sethead span{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.sethead .shl{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.setctl{display:inline-flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0}
.colhead{display:grid;grid-template-columns:16px 26px minmax(120px,1fr) 56px 110px 100px 52px 30px 30px 30px 30px;gap:6px;align-items:center;padding:2px 10px;border-bottom:1px solid var(--line)}
.ch{font:inherit;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:none;border:0;padding:3px 4px;margin-left:-4px;text-align:left;cursor:pointer;border-radius:5px;white-space:nowrap}
.ch:hover{background:var(--line2);color:var(--text)}
.ch.on{color:var(--navy)}
.ch.r{text-align:right;margin-left:0;margin-right:-4px;justify-self:end}
.ch i{font-style:normal;font-size:9px;margin-left:3px}
.ib.shuf{font-size:13px;height:22px;width:26px}
.setvox{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:0 12px 6px}
.setvox .svl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.sv{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:12px;padding:0 8px;background:#fff;cursor:pointer;color:var(--text);line-height:18px}
.sv:hover{border-color:#c9c2b2}
.sv b{color:var(--navy);margin-left:3px}
.sv.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.lu{font:inherit;font-size:12px;border:1px solid var(--navy);background:#eef0fa;color:var(--navy);border-radius:20px;padding:2px 10px;cursor:pointer;font-weight:600}
.lu.out{border:1px dashed #c3bdb0;background:#fff;color:var(--muted);text-decoration:line-through;font-weight:500}
.item{display:grid;grid-template-columns:16px 26px minmax(120px,1fr) 56px 110px 100px 52px 30px 30px 30px 30px;gap:6px;align-items:center;padding:5px 10px;border-top:3px solid transparent;border-bottom:1px solid var(--line2);background:#fff}
.item:hover{background:#fdfbf6}
.item.drop-before{border-top-color:var(--orange)}
.item.dragging{opacity:.35}
.item .handle{cursor:grab;color:#bdb5a3;font-size:13px;letter-spacing:-2px}
.item .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.item .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{display:block;font-size:11px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .k,.item .v{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{color:var(--muted)}
.item .l{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:text;border-radius:5px}
.item .l:hover{background:var(--line2)}
.item .l .addlen{color:#c3bdb0;font-size:11px}
.leninput{width:52px;padding:1px 4px;font-size:13px;text-align:right}
.ib{border:0;background:none;cursor:pointer;color:#a39b89;font-size:15px;border-radius:6px;height:26px;padding:0}
.ib:hover{background:var(--line2);color:var(--text)}
.ib.seg.on{background:var(--navy);color:#fff}
.item.chain{background:#eef0fa;border-left:4px solid var(--navy);padding-left:6px}
.item.chain:hover{background:#e6e9f7}
.item.chain.c-start{margin-top:4px;border-top-left-radius:8px}
.item.chain.c-end{margin-bottom:4px;border-bottom-left-radius:8px}
.item.chain:not(.c-end){border-bottom:1px dashed #c4c9e6}
.segtag{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--navy);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px;letter-spacing:.04em}
.item .tg{display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.item .tg .tag{margin:0;font-size:10px;padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.locked{background:#fffaf0}
.item.locked .n{color:var(--warn);font-weight:800}
.handle.lockh{cursor:default;font-size:10px;letter-spacing:0;opacity:.8}
.ib.lk{font-size:12px;filter:grayscale(1);opacity:.3}
.ib.lk:hover{opacity:.75}
.ib.lk.on{filter:none;opacity:1;background:#fff1c7}
.clashnote{color:#8a4b00;font-weight:700}
.tagrows{display:flex;flex-direction:column;gap:6px}
.tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tagrow .tag{min-width:80px;text-align:center}
.swatches{display:flex;gap:3px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy)}
.item.break{grid-template-columns:16px 1fr 90px 30px;background:#f3efe6;margin:6px 0}
.item.break input{padding:3px 7px}
.item.break .blabel{font-weight:700}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(25,28,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;padding:22px;width:560px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.wide{width:1180px}
.sptable{width:100%;border-collapse:collapse;font-size:13px}
.sptable td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.sptable td.n{color:var(--muted);width:28px;text-align:right}
.sptable .sa{color:var(--muted);font-size:12px}
.sptable .ok{color:#1a7f45}.sptable .auto{color:#9a6a00}.sptable .none{color:var(--muted);font-style:italic}
.sptable .acts{white-space:nowrap;text-align:right;width:1%}
.spfind{background:var(--line2);border-radius:8px;padding:8px;margin-top:6px}
.spfind .row{margin-bottom:6px}
.spres{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.spres button{all:unset;cursor:pointer;padding:5px 8px;border-radius:6px;background:#fff;display:flex;justify-content:space-between;gap:10px}
.spres button:hover{outline:2px solid var(--navy)}
.spstat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.spwarn{background:#fff6e0;border:1px solid #f0d58a;border-radius:8px;padding:8px 10px;font-size:13px}
.mbox label{margin-bottom:10px}
.mbox label input,.mbox label textarea{width:100%}
.mbox label input[type=checkbox],.mbox label input[type=radio]{width:auto;margin:0}
.mbox label.opt,.colrow label{justify-content:flex-start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:-4px 0 10px}
.chips .tag{cursor:pointer;opacity:.8}
.chips .tag:hover{opacity:1}
.parts{display:flex;flex-direction:column;gap:4px;margin:4px 0 6px}
.parts div{display:flex;justify-content:space-between;align-items:center;background:#f6f3ec;border-radius:7px;padding:4px 4px 4px 10px;font-size:14px;color:var(--text);font-weight:500}
.row{display:flex;gap:6px}
.voxpick{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.vchip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:20px;padding:4px 12px;cursor:pointer}
.vchip:hover{border-color:#c9c2b2}
.vchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.vchip.extra{border-style:dashed}
.vchip b{display:inline-block;background:var(--yellow);color:var(--navy);border-radius:10px;font-size:10px;min-width:15px;margin-right:5px;padding:0 3px}
.mlist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.mlist .row input{flex:1}
.row input{flex:1}
.cmpnote{font-size:12px;color:var(--muted);margin:-4px 0 10px}

/* Print dialog */
.pwrap{display:grid;grid-template-columns:300px 1fr;gap:20px}
.pwrap aside{display:flex;flex-direction:column;gap:6px}
.collist{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.colrow{display:flex;align-items:center;gap:6px;background:#f6f3ec;border-radius:7px;padding:3px 4px 3px 8px;cursor:grab}
.colrow.drop-before{box-shadow:0 -3px 0 var(--orange)}
.colrow label{flex-direction:row;align-items:center;gap:7px;margin:0;font-size:14px;color:var(--text);font-weight:500;flex:1;cursor:pointer}
.opt{flex-direction:row;align-items:center;gap:7px;font-size:14px;color:var(--text);font-weight:500;margin:0 !important}
.pview{background:#d9d5cc;border-radius:10px;padding:20px;overflow:auto;max-height:calc(100vh - 160px)}
.page{background:#fff;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:0.5in;position:relative}
.pageinfo{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* Printed document (shared by preview + print) */
.pdoc{color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
.pdoc .phead{text-align:center;margin-bottom:.6em}
.pdoc .phead img{height:5.2em;max-width:60%;object-fit:contain}
.pdoc .pname{font-size:1.35em;font-weight:800;margin-top:.15em}
.pdoc .psub{font-size:.9em;color:#555}
.pdoc .pnotes{font-size:.85em;color:#333;margin:.2em 0 .6em;white-space:pre-wrap;text-align:center}
.pdoc table{width:100%;border-collapse:collapse;table-layout:fixed}
.pdoc td{overflow-wrap:anywhere}
.pdoc .pset{break-inside:avoid;page-break-inside:avoid}
@media screen{
  .page .pdoc .pblk.newpage{margin-top:1.4em;border-top:2px dashed #b5b0a5;position:relative}
  .page .pdoc .pblk.newpage::before{content:"page break";position:absolute;top:-1.25em;right:0;font-size:10px;color:#9a948a;text-transform:uppercase;letter-spacing:.08em}
}
@media print{ .pdoc .pblk.newpage{break-before:page;page-break-before:always} }
.pdoc th{text-align:left;font-size:.7em;text-transform:uppercase;letter-spacing:.06em;color:#555;border-bottom:2px solid #111;padding:.25em .4em}
.pdoc td{padding:.32em .4em;border-bottom:1px solid #ccc;vertical-align:top}
.pdoc tr{break-inside:avoid;page-break-inside:avoid}
.pdoc td.c-num{width:2.2em;text-align:right;color:#555;font-variant-numeric:tabular-nums}
.pdoc td.c-title{font-weight:700}
.pdoc .mparts{font-size:.72em;font-weight:500;color:#555;margin-top:.05em}
.pdoc td.c-length,.pdoc td.c-tempo{font-variant-numeric:tabular-nums;white-space:nowrap}
.pdoc td.c-key{white-space:nowrap}
.pdoc td.c-notes,.pdoc td.c-tags{font-size:.8em;color:#333}
.pdoc .segarrow{font-weight:900}
.pdoc tr.pchain td{background:#eef0fa}
.pdoc tr.pchain td:first-child{box-shadow:inset 4px 0 0 #2f3a68}
.pdoc tr.pchain.pmid td{border-bottom:1px dashed #b9bfdc}
.pdoc tr.pchain.pstart td{border-top:2px solid #2f3a68}
.pdoc tr.pchain.pend td{border-bottom:2px solid #2f3a68}
.pdoc tr.pgap td{height:.5em;padding:0;border:0;background:transparent}
.pdoc tr.pbreak td{text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.12em;padding:.55em 0;background:#dcdcdc;color:#222;border-top:2px solid #111;border-bottom:2px solid #111;font-size:.85em}
.pdoc tr.ptot td{text-align:right;font-size:.75em;color:#555;border-bottom:0;padding-top:.2em}
.pdoc .pfoot{margin-top:.8em;font-size:.8em;color:#444;text-align:right}

/* Lyrics (editor preview + book) */
.lyedit{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:220px;line-height:1.45;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.lyprev{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;max-height:240px;overflow:auto;font-size:14px;margin:-4px 0 10px;background:#fcfbf8}
.lyprev:empty{display:none}
.lytext .lyl{white-space:pre-wrap;line-height:1.35;min-height:1.35em}
.lytext .lyl.chl{line-height:1.15;margin-top:.15em}
.lytext .seg{display:inline-block;vertical-align:baseline;white-space:pre}
.lytext .seg b{display:block;font-size:.78em;font-weight:800;color:#1d4ea8;line-height:1.15;min-height:1.15em;padding-right:.35em}
.lytext .lyblank{height:.75em}
.lytext .lysec{font-weight:800;text-transform:uppercase;font-size:.7em;letter-spacing:.08em;color:#777;margin:.55em 0 .1em}

<body>
<header>
  <span id="brand" class="brand"></span>
  <nav>
    <button data-nav="setlists">Setlists</button>
    <button data-nav="catalog">Song catalog</button>
    <button data-nav="settings">Band settings</button>
  </nav>
  <span class="grow"></span>
  <span id="dirty" class="dirtyflag"></span>
  <label class="btn hbtn" title="Open a band .json file">Open band file…<input type="file" id="openBand" accept=".json,application/json" hidden></label>
  <button class="btn primary hbtn" id="saveBand" title="Download this band's .json file">Save band file</button>
</header>
<div id="banner"></div>
<main id="main"></main>
<div id="modal"></div>
<datalist id="songTitles"></datalist><datalist id="artistList"></datalist>
<div id="printOut"></div>

<script>
const STORE_KEY = 'setlist-builder-v1';
const OLD_KEY = 'someguys-setlists-v1';
const FILE_FORMAT = 'setlist-builder-band';
const COLS = {num:'#', title:'Song', artist:'Artist', key:'Key', vox:'Lead vox', length:'Length', tempo:'BPM', notes:'Notes', tags:'Tags'};
const PAPER_IN = {letter:{w:8.5, h:11, css:'letter'}, a4:{w:210/25.4, h:297/25.4, css:'A4'}};
/* Page geometry in CSS px for the chosen paper and margin (inches). */
function paperDims(st){
  const P=PAPER_IN[st.paper]||PAPER_IN.letter, m=Number(st.margin??0.5);
  return {w:P.w+'in', m, cw:(P.w-2*m)*96, ch:(P.h-2*m)*96, css:P.css};
}

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
function fmt(sec){ if(sec==null||sec===''||isNaN(sec)) return ''; sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; }
function parseLen(v){ v=String(v??'').trim(); if(!v) return null; if(/^\d+(\.\d+)?$/.test(v)) return Math.round(parseFloat(v)*60); const p=v.split(':').map(x=>Number(x.trim())); if(p.some(isNaN)) return null; return p.reduce((a,b)=>a*60+b,0); }
const voxStr = a => (a||[]).join(' / ');
const parseVox = s => String(s||'').split('/').map(t=>t.trim()).filter(Boolean);
const parseTags = s => [...new Set(String(s||'').split(',').map(t=>t.trim().toLowerCase()).filter(Boolean))];
const numOrNull = v => { v=String(v??'').trim(); if(!v) return null; const n=Number(v); return isNaN(n)?null:n; };
const sortTitle = t => String(t||'').replace(/^(the|a)\s+/i,'').toLowerCase();
function fmtDate(d){ if(!d) return ''; const x=new Date(d+'T00:00:00'); return isNaN(x)?d:x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* ---------- state ---------- */
let S, view='setlists', curId=null;
function newSong(o={}){ return Object.assign({id:uid(), type:'song', title:'', artist:'', key:'', vox:[], length:null, tempo:null, notes:'', tags:[], parts:[], lyrics:'', noBook:false, bookChords:true}, o); }
function defaultSettings(){ return {logo:null, showLogo:true, columns:Object.keys(COLS).map(id=>({id,on:['num','title','key','vox'].includes(id)})), fit:'flow', fontSize:16, showTotals:true, showNotes:true, showParts:true, paper:'letter', margin:0.5, defaultBuffer:30, members:null, tagColors:{}, showSetVox:true, book:{who:'', chords:true, fontSize:22, cover:true}, spotify:{clientId:''}}; }
function freshState(name){ return {format:FILE_FORMAT, version:1, band:{name}, songs:[], setlists:[], settings:Object.assign(defaultSettings(),{members:[]})}; }
function load(){
  let raw=null, migrated=false;
  try{
    raw=localStorage.getItem(STORE_KEY);
    if(!raw && localStorage.getItem(OLD_KEY)){ raw=localStorage.getItem(OLD_KEY); migrated=true; }
  }catch(e){ banner('Browser storage is unavailable, so work is only kept until you close this tab. Save the band file before leaving.'); }
  S=null;
  try{ if(raw) S=JSON.parse(raw); }catch(e){}
  if(!S) return;
  normalize();
  if(migrated){ save(); try{ localStorage.removeItem(OLD_KEY); }catch(e){} }
}
function normalize(){
  S.format=FILE_FORMAT; S.version ||= 1;
  S.band ||= {name:'My band'}; if(!S.band.name) S.band.name='My band';
  S.songs ||= []; S.setlists ||= [];
  S.settings = Object.assign(defaultSettings(), S.settings||{});
  const have=new Set(S.settings.columns.map(c=>c.id));
  for(const id in COLS) if(!have.has(id)) S.settings.columns.push({id,on:false});
  S.settings.columns = S.settings.columns.filter(c=>COLS[c.id]);
  delete S.settings.spreadTags; delete S.settings.spreadDist;
  S.settings.tagColors ||= {};
  const tagSet=new Set(S.songs.flatMap(x=>x.tags||[]));
  if(tagSet.has('holiday') && !S.settings.tagColors.holiday) S.settings.tagColors.holiday='red';
  if(tagSet.has('halloween') && !S.settings.tagColors.halloween) S.settings.tagColors.halloween='orange';
  if(!Array.isArray(S.settings.members)) S.settings.members=[...new Set(S.songs.flatMap(s=>s.vox))].filter(v=>v!=='All');
}
function save(markDirty=true){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ banner('Could not save to browser storage (unavailable or full). Use “Save band file” so you don’t lose work.'); }
  if(markDirty) setDirty(true);
}
function isDirty(){ try{ return localStorage.getItem(STORE_KEY+':dirty')==='1'; }catch(e){ return !!window._dirty; } }
function setDirty(v){ window._dirty=v; try{ localStorage.setItem(STORE_KEY+':dirty', v?'1':'0'); }catch(e){} const d=$('#dirty'); if(d) d.textContent = v ? '● Unsaved changes' : ''; }
window.addEventListener('beforeunload', e=>{ if(S && isDirty()){ e.preventDefault(); e.returnValue=''; } });
const slug = t => (String(t||'band').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'band');
function saveBandFile(){
  if(!S) return;
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=slug(S.band.name)+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); setDirty(false);
}
function openBandFile(file){
  file.text().then(t=>{
    let d; try{ d=JSON.parse(t); }catch(err){ alert('That file is not a valid band file.'); return; }
    if(!d || !Array.isArray(d.songs) || !Array.isArray(d.setlists)){ alert('That file is not a valid band file.'); return; }
    if(S && isDirty() && !confirm(`You have unsaved changes to “${S.band.name}”.\n\nOpen “${d.band?.name||file.name}” anyway and discard them?`)) return;
    S=d; normalize(); save(false); setDirty(false); sel.clear(); curId=null; go('setlists');
  });
}
function startNewBand(name){
  name=String(name||'').trim(); if(!name) return false;
  if(S && isDirty() && !confirm(`You have unsaved changes to “${S.band.name}”.\n\nStart a new band anyway and discard them?`)) return false;
  S=freshState(name); normalize(); save(false); setDirty(true); curId=null; go('catalog'); return true;
}
$('#openBand').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) openBandFile(f); };
$('#saveBand').onclick=saveBandFile;
function banner(msg){ $('#banner').innerHTML = msg ? `<div class="banner">${esc(msg)}</div>` : ''; }
const songById = id => S.songs.find(s=>s.id===id);
/* Artist is a catalog fact, never overridden per gig. A mashup shows its parts' artists. */
function songArtist(s){ if(!s) return ''; if(s.type!=='mashup') return s.artist||''; return [...new Set((s.parts||[]).map(p=>typeof p==='string'?songById(p)?.artist:'').filter(Boolean))].join(' / '); }
function itemArtist(it){ return songArtist(songById(it.songId)); }
function itemLen(it){ const s=songById(it.songId); return s ? s.length : it.length; }
const cur = () => S.setlists.find(s=>s.id===curId);
function touch(){ const sl=cur(); if(sl){ sl.updated=Date.now(); if(!rearranging) delete arrHist[sl.id]; } save(); }
/* Undo history for sort/shuffle only (in memory, last 10). Any other edit clears it so undo never discards later work. */
const arrHist={}; let rearranging=false;
const logoSrc = () => S.settings.logo || '';
const TAG_COLORS = {
  red:['#fde2e1','#9b1c1c'], orange:['#ffe4c7','#9a4a00'], yellow:['#fff1b8','#715400'], green:['#d9f2df','#1e6b3a'],
  teal:['#d2f1ed','#0f5f58'], blue:['#dce7ff','#1d4ea8'], indigo:['#e3e3fb','#3730a3'], purple:['#eedff9','#6b21a8'],
  pink:['#fbdfee','#9d174d'], gray:['#e9e9e9','#3f3f3f']};
function tagColor(t){
  const tc = S.settings.tagColors ||= {};
  if(!TAG_COLORS[tc[t]]){
    const used={}; Object.values(tc).forEach(c=>used[c]=(used[c]||0)+1);
    tc[t] = Object.keys(TAG_COLORS).filter(c=>c!=='gray').sort((a,b)=>(used[a]||0)-(used[b]||0))[0];
  }
  return TAG_COLORS[tc[t]];
}
function tagChip(t, attrs=''){ const [bg,fg]=tagColor(t); return `<span class="tag" style="background:${bg};color:${fg}" ${attrs}>${esc(t)}</span>`; }
function allTags(){ return [...new Set(S.songs.flatMap(s=>s.tags))].sort(); }
function allVox(){ return [...new Set(S.songs.flatMap(s=>s.vox))].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b)); }
function itemTitle(it){ const s=songById(it.songId); return s ? s.title : (it.title||'(deleted song)'); }
const partTitle = p => typeof p==='string' ? songById(p)?.title : p?.title;
function mashupParts(song){ return song && song.type==='mashup' ? (song.parts||[]).map(partTitle).filter(Boolean).join(' / ') : ''; }
function itemParts(it){ const s=songById(it.songId); return s ? mashupParts(s) : (it.parts||''); }
function itemType(it){ const s=songById(it.songId); return s ? s.type : 'song'; }
function sortedSongs(list){ return [...list].sort((a,b)=>sortTitle(a.title).localeCompare(sortTitle(b.title))); }
function updateTitleList(){ $('#songTitles').innerHTML = sortedSongs(S.songs.filter(s=>s.type==='song')).map(s=>`<option value="${esc(s.title)}">`).join(''); }

/* ---------- durations ---------- */
function computeSets(sl){
  const buf = Number(sl.buffer)||0;
  const sets=[{songs:[]}], breaks=[];
  sl.items.forEach(it=>{ if(it.kind==='break'){ breaks.push(it); sets.push({songs:[]}); } else sets[sets.length-1].songs.push(it); });
  sets.forEach(st=>{
    st.count=st.songs.length;
    st.missing=st.songs.filter(s=>!itemLen(s)).length;
    st.music=st.songs.reduce((a,s)=>a+(itemLen(s)||0),0);
    let gaps=0; st.songs.forEach((s,i)=>{ if(i<st.songs.length-1 && !s.segue) gaps++; });
    st.total=st.music+gaps*buf;
  });
  const play=sets.reduce((a,s)=>a+s.total,0), brk=breaks.reduce((a,b)=>a+(b.length||0),0);
  return {sets, breaks, play, brk, withBreaks:play+brk, missing:sets.reduce((a,s)=>a+s.missing,0), songs:sets.reduce((a,s)=>a+s.count,0)};
}
function durText(sec, missing){ if(!sec && missing) return 'no lengths yet'; return (missing?'≥ ':'')+fmt(sec); }
function targetCls(sec, target){ if(!target) return ''; const t=target*60; if(sec>t) return 'over'; if(t-sec<=300) return 'near'; return 'under'; }

/* ---------- navigation ---------- */
document.querySelector('nav').addEventListener('click', e=>{ const b=e.target.closest('[data-nav]'); if(b) go(b.dataset.nav); });
function go(v, id){ view=v; if(id!==undefined) curId=id; render(); window.scrollTo(0,0); }
function render(){
  document.body.classList.toggle('welcome', !S);
  if(!S){ $('#brand').innerHTML='Setlist Builder'; document.title='Setlist Builder'; renderWelcome(); return; }
  $('#brand').innerHTML = (logoSrc()?`<img src="${logoSrc()}" alt="">`:'') + `<span>${esc(S.band.name)}</span>`;
  document.title = S.band.name+' · Setlists';
  setDirty(isDirty());
  $$('nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===view || (view==='builder'&&b.dataset.nav==='setlists')));
  updateTitleList();
  ({setlists:renderSetlists, catalog:renderCatalog, settings:renderSettings, builder:renderBuilder})[view]();
}

function renderWelcome(){
  $('#main').innerHTML = `<div class="welcomebox">
    <div class="card"><h2>Open a band file</h2><p class="muted">Pick up where you left off. Choose the <code>.json</code> file you saved last time.</p>
      <label class="btn primary" style="flex-direction:row;justify-content:center;color:#fff;font-size:14px">Open band file…<input type="file" id="wOpen" accept=".json,application/json" hidden></label></div>
    <div class="card"><h2>Start a new band</h2><p class="muted">Begin with an empty catalog. You can import songs from a CSV and add members and a logo in Band settings.</p>
      <input id="wName" placeholder="Band or event name"><button class="btn" id="wNew">Create</button></div>
  </div>
  <p class="muted" style="text-align:center">Your work is also kept in this browser between visits, but the band file is the copy to rely on. Use “Save band file” when you're done.</p>`;
  $('#wOpen').onchange=e=>{ const f=e.target.files[0]; if(f) openBandFile(f); };
  const mk=()=>{ if(!startNewBand($('#wName').value)) $('#wName').focus(); };
  $('#wNew').onclick=mk; $('#wName').onkeydown=e=>{ if(e.key==='Enter') mk(); };
}

/* ---------- action dispatch (main) ---------- */
const ACT = {};
$('#main').addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const fn=ACT[b.dataset.act]; if(fn){ e.preventDefault(); fn(b.dataset, e, b); } });

/* ---------- setlists view ---------- */
function renderSetlists(){
  const list=[...S.setlists].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.updated||0)-(a.updated||0));
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Setlists</h1><span class="grow"></span><button class="btn primary" data-act="newSetlist">+ New setlist</button></div>
    ${list.length ? `<div class="tablewrap"><table class="data slgrid"><thead><tr><th>Name</th><th>Date</th><th>Venue</th><th style="text-align:right">Songs</th><th style="text-align:right">Playing time</th><th></th></tr></thead><tbody>
    ${list.map(sl=>{ const c=computeSets(sl); return `<tr data-act="openSl" data-id="${sl.id}"><td><b>${esc(sl.name)}</b></td><td>${esc(fmtDate(sl.date))}</td><td>${esc(sl.venue)}</td><td class="num">${c.songs}</td><td class="num">${c.songs?durText(c.play,c.missing):''}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-act="dupSl" data-id="${sl.id}">Duplicate</button> <button class="btn sm danger" data-act="delSl" data-id="${sl.id}">Delete</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="card empty">No setlists yet.<br><br><button class="btn primary" data-act="newSetlist">+ Create your first setlist</button></div>`}`;
}
ACT.newSetlist = () => { const sl={id:uid(), name:'New setlist', date:today(), venue:'', notes:'', target:null, setTarget:null, buffer:S.settings.defaultBuffer, items:[], created:Date.now(), updated:Date.now()}; S.setlists.push(sl); save(); go('builder', sl.id); setTimeout(()=>{ const n=$('#slName'); n&&n.select(); },0); };
ACT.openSl = d => go('builder', d.id);
ACT.dupSl = d => { const o=S.setlists.find(s=>s.id===d.id); const c=clone(o); c.id=uid(); c.name=o.name+' (copy)'; c.items.forEach(i=>i.id=uid()); c.created=c.updated=Date.now(); S.setlists.push(c); save(); go('builder', c.id); setTimeout(()=>{ const n=$('#slName'); n&&n.select(); },0); };
ACT.delSl = d => { const o=S.setlists.find(s=>s.id===d.id); if(!confirm(`Delete setlist "${o.name}"? This can't be undone.`)) return; S.setlists=S.setlists.filter(s=>s.id!==d.id); save(); render(); };

/* ---------- catalog view ---------- */
const cat={q:'', tag:'', vox:'', missing:false, nolyrics:false, type:'', sort:'title', dir:1};
function matches(s, f){
  const q=(f.q||'').trim().toLowerCase();
  if(q && !(s.title.toLowerCase().includes(q) || songArtist(s).toLowerCase().includes(q) || s.tags.some(t=>t.includes(q)) || (s.notes||'').toLowerCase().includes(q) || voxStr(s.vox).toLowerCase().includes(q))) return false;
  if(f.tag && !s.tags.includes(f.tag)) return false;
  if(f.vox && !s.vox.includes(f.vox)) return false;
  if(f.missing && s.key && s.vox.length) return false;
  if(f.nolyrics && (s.lyrics||'').trim()) return false;
  if(f.noartist && (s.type==='mashup' || (s.artist||'').trim())) return false;
  if(f.type && s.type!==f.type) return false;
  return true;
}
function filterOpts(){ return `<option value="">All tags</option>${allTags().map(t=>`<option>${esc(t)}</option>`).join('')}`; }
function voxOpts(){ return `<option value="">All singers</option>${allVox().map(t=>`<option>${esc(t)}</option>`).join('')}`; }
function renderCatalog(){
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Song catalog</h1><span class="muted" id="catCount"></span><span class="grow"></span>
      <button class="btn" data-act="newMashup">+ Mashup</button><button class="btn primary" data-act="newSong">+ Song</button></div>
    <div class="toolbar">
      <input type="search" id="cq" placeholder="Search title, artist, tag, singer, notes…" style="width:280px" value="${esc(cat.q)}">
      <select id="ctag">${filterOpts()}</select><select id="cvox">${voxOpts()}</select>
      <select id="ctype"><option value="">Songs &amp; mashups</option><option value="song">Songs only</option><option value="mashup">Mashups only</option></select>
      <label class="opt"><input type="checkbox" id="cmiss" ${cat.missing?'checked':''}> Missing key or vox</label>
      <label class="opt"><input type="checkbox" id="cnoart" ${cat.noartist?'checked':''}> No artist</label>
      <label class="opt"><input type="checkbox" id="cnoly" ${cat.nolyrics?'checked':''}> No lyrics yet</label>
    </div>
    <div class="tablewrap"><table class="data"><thead><tr>
      ${[['title','Title'],['artist','Artist'],['key','Key'],['vox','Lead vox'],['length','Length'],['tempo','BPM'],['tags','Tags'],['notes','Notes']].map(([k,l])=>`<th data-act="sort" data-k="${k}">${l}${cat.sort===k?(cat.dir>0?' ▲':' ▼'):''}</th>`).join('')}
    </tr></thead><tbody id="ctbody"></tbody></table></div>`;
  $('#ctag').value=cat.tag; $('#cvox').value=cat.vox; $('#ctype').value=cat.type;
  $('#cq').oninput=e=>{cat.q=e.target.value; renderCatTable();};

/* Locked songs keep their slot within their set (or stay last, if locked as the set's last song).
   After any change, each set is rebuilt: locked songs go back to their slots, unlocked songs fill the rest in order. */
function applyLocks(sl){
  if(!sl.items.some(i=>i.locked)) return;
  const out=[]; let seg=[];
  const flush = () => {
    const n=seg.length, res=new Array(n).fill(null);
    const ends=seg.filter(i=>i.locked && i.lockEnd);
    ends.forEach((it,k)=>{ res[n-ends.length+k]=it; });
    seg.filter(i=>i.locked && !i.lockEnd).sort((a,b)=>a.lockPos-b.lockPos).forEach(it=>{
      const p=Math.max(0, Math.min(it.lockPos||0, n-1)); let q=p;
      while(q<n && res[q]) q++;
      if(q>=n){ q=p; while(q>=0 && res[q]) q--; }
      res[q]=it;
    });
    const free=seg.filter(i=>!i.locked); let f=0;
    for(let k=0;k<n;k++) if(!res[k]) res[k]=free[f++];
    out.push(...res); seg=[];
  };
  sl.items.forEach(it=>{ if(it.kind==='break'){ flush(); out.push(it); } else seg.push(it); });
  flush();
  sl.items=out;
}
function segueChain(items, idx){
  let a=idx, b=idx;
  while(a>0 && items[a-1].kind==='song' && items[a-1].segue) a--;
  while(b<items.length-1 && items[b].segue && items[b+1].kind==='song') b++;
  return [a,b];
}
function setBounds(items, idx){
  let s=idx, e=idx;
  while(s>0 && items[s-1].kind!=='break') s--;
  while(e<items.length-1 && items[e+1].kind!=='break') e++;
  return [s,e];
}

    return `<div class="colhead"><span></span><span></span>${h('title','Song')}${h('key','Key')}${h('vox','Vox')}${h('tag','Tags')}${h('length','Len','r')}<span></span><span></span><span></span><span></span></div>`;
  };
  let html=head(0), n=0, si=0;
  sl.items.forEach((it,idx)=>{
    if(it.kind==='break'){
      html+=`<div class="item break" draggable="true" data-idx="${idx}"><span class="handle" title="Drag to move">⋮⋮</span>

        <span class="k">${esc(it.key)}</span><span class="v">${esc(voxStr(it.vox))}</span>
        <span class="tg">${tags.map(t=>tagChip(t)).join('')}</span>

function setRanges(items){ const r=[]; let a=0; items.forEach((it,i)=>{ if(it.kind==='break'){ r.push([a,i]); a=i+1; } }); r.push([a,items.length]); return r; }
/* Rearrange the unlocked part of set k. Segue groups move as one unit; locked units stay in their slots. */
function rearrangeSet(sl, k, order){
  const rg=setRanges(sl.items)[k]; if(!rg) return false;
  const [a,b]=rg, seg=sl.items.slice(a,b); if(seg.length<2) return false;
  const units=[]; for(let i=0;i<seg.length;){ let j=i; while(j<seg.length-1 && seg[j].segue) j++; units.push(seg.slice(i,j+1)); i=j+1; }
  const isFixed=u=>u.some(x=>x.locked);
  const res=new Array(seg.length).fill(null); let pos=0;
  units.forEach(u=>{ if(isFixed(u)) u.forEach((x,o)=>{ res[pos+o]=x; }); pos+=u.length; });
  const rest=order(units.filter(u=>!isFixed(u)));
  for(let i=0;i<res.length;){
    if(res[i]){ i++; continue; }
    let j=i; while(j<res.length && !res[j]) j++;
    let p=i, left=j-i;
    while(left>0 && rest.length){ const ix=rest.findIndex(u=>u.length<=left); if(ix<0) break; const u=rest.splice(ix,1)[0]; u.forEach(x=>{ res[p++]=x; }); left-=u.length; }

  }
  if(rest.length){ const flat=rest.flat(); for(let i=0;i<res.length;i++) if(!res[i]) res[i]=flat.shift(); }

const sortUnits=(key,dir)=>us=>[...us].sort((x,y)=>{

function wireBuilderDnD(){
  const bcat=$('#bcat'), list=$('#sitems');

  bcat.addEventListener('dragstart', e=>{ const r=e.target.closest('[data-sid]'); if(!r) return; const id=r.dataset.sid; const ids=sel.has(id)?orderedSel():[id]; drag={src:'cat', ids}; e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain', ids.map(i=>songById(i).title).join('\n')); });

  const clear = () => { list.classList.remove('drop-end'); $$('.drop-before',list).forEach(x=>x.classList.remove('drop-before')); };
  const dropIdx = y => { for(const r of $$('.item[data-idx]',list)){ const b=r.getBoundingClientRect(); if(y<b.top+b.height/2) return +r.dataset.idx; } return cur().items.length; };
  list.addEventListener('dragover', e=>{ if(!drag) return; e.preventDefault(); e.dataTransfer.dropEffect = drag.src==='cat'?'copy':'move'; const i=dropIdx(e.clientY); clear(); const r=$(`.item[data-idx="${i}"]`,list); r ? r.classList.add('drop-before') : list.classList.add('drop-end'); });

/* ---------- chords & lyrics ---------- */
const CHORD_RE=/^[A-G][#b]?(?:maj|min|m|M|dim|aug|sus|add|°|ø|\+)?\d*(?:(?:sus|add|maj|b|#|\+|-)?\d+)*(?:\([^)]*\))?(?:\/[A-G][#b]?)?$/;
const isChord = t => CHORD_RE.test(t);
const isChordLine = l => { const t=l.trim().split(/\s+/).filter(Boolean); return t.length>0 && t.some(isChord) && t.every(x=>isChord(x) || /^(\||\/|-|N\.?C\.?|\(?x\d+\)?)$/i.test(x)); };

/* Convert "chords on their own line above the words" into inline [C]hords. */
function chordsAboveToInline(text){
  const L=String(text).replace(/\r\n?/g,'\n').split('\n'), out=[];
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(!isChordLine(l)){ out.push(l); continue; }
    const ch=[]; l.replace(/\S+/g,(m,pos)=>{ if(isChord(m)) ch.push([pos,m]); return m; });
    const nx=L[i+1];
    if(nx!==undefined && nx.trim() && !isChordLine(nx) && !isSectionLine(nx)){
      let ly=nx; const maxP=Math.max(...ch.map(c=>c[0])); if(ly.length<maxP) ly=ly.padEnd(maxP,' ');
      for(let k=ch.length-1;k>=0;k--){ const [pos,c]=ch[k]; ly=ly.slice(0,pos)+'['+c+']'+ly.slice(pos); }
      out.push(ly.replace(/\s+$/,'')); i++;
    } else out.push(ch.map(c=>'['+c[1]+']').join(' '));
  }
  return out.join('\n');
}
const NOTE_IDX={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};

function keyUsesFlats(k){ const p=parseKey(k); if(!p) return false; if(p.root.includes('b')) return true; if(p.root.includes('#')) return false; return p.minor ? ['D','G','C','F'].includes(p.root) : p.root==='F'; }
/* Chords are written in the catalog key; transpose them when this gig plays the song in another key. */
function transposeFor(it){
  const s=songById(it.songId); if(!s) return null;
  const from=parseKey(s.key), to=parseKey(it.key); if(!from || !to) return null;
  const n=(to.i-from.i+12)%12; return n ? {n, flats:keyUsesFlats(it.key), from:s.key, to:it.key} : null;
}
function transposeChord(c, tr){
  if(!tr) return c;
  const t = r => NOTE_IDX[r]==null ? r : (tr.flats?FLATS:SHARPS)[(NOTE_IDX[r]+tr.n)%12];

const SECTION_RE=/^(intro|verse|pre-?chorus|chorus|bridge|outro|solo|tag|interlude|refrain|coda|instrumental|break|hook|post-?chorus|ending)\b[\w\s]{0,12}:?$/i;
function lyricsHtml(text, chords=true, tr=null){
  const lines=String(text||'').replace(/\r\n?/g,'\n').replace(/\s+$/,'').split('\n');
  return lines.map(line=>{
    const tl=line.trim();
    if(!tl) return '<div class="lyblank"></div>';
    const br=tl.match(/^\[([^\]]+)\]:?$/);
    if(isSectionLine(tl)) return `<div class="lysec">${esc(br?br[1]:tl.replace(/:$/,''))}</div>`;
    const segs=[]; let seg={c:null,t:''}, last=0;

      if(isChord(m[1].trim())){ seg.t+=line.slice(last,m.index); segs.push(seg); seg={c:m[1].trim(),t:''}; }
      else seg.t+=line.slice(last,m.index+m[0].length);
      last=m.index+m[0].length;
    }
    seg.t+=line.slice(last); segs.push(seg);
    if(!segs.some(x=>x.c)) return `<div class="lyl">${esc(line)}</div>`;
    if(!chords){ const words=segs.map(x=>x.t).join('').replace(/ {2,}/g,' ').trim(); return words?`<div class="lyl">${esc(words)}</div>`:''; }
    return `<div class="lyl chl">${segs.filter(x=>x.c||x.t).map(x=>{

/* Fit each song: try 2 columns, then shrink the text down to 60% (50% if it's only a few lines over). A song that still

const BOOK_MIN=0.6;

function fitBookPage(pg, fixed){
  const body=$('.lpbody',pg), txt=$('.lptext',pg); if(!body||!txt) return;
  const over = () => txt.scrollHeight > body.clientHeight + 1 || txt.scrollWidth > body.clientWidth + 1;
  const size = f => txt.style.fontSize=f.toFixed(2)+'em';
  if(fixed==null){
    size(1); txt.classList.remove('cols');
    if(!over()) return;
    if(txt.classList.contains('cvlist')){ let f=1; while(over() && f>0.45){ f-=0.04; size(f); } return; }
    txt.classList.add('cols'); if(!over()) return;

    if(!over()) return;

  out.innerHTML = $$('#bView .lpage').map(p=>p.outerHTML).join('');
  $('#pageStyle').textContent=`@page{size:${BOOK.w}in ${BOOK.h}in;margin:${BOOK.m}in}`;
  const old=document.title;
  document.title = [sl.name, sl.date, 'lyrics'].filter(Boolean).join(' ');
  setTimeout(()=>{ window.print(); document.title=old; }, 50);
}

function doPrint(){
  const sl=cur(), out=$('#printOut');
  out.innerHTML = $('#ppage').innerHTML;
  const old=document.title;
  document.title = [sl.name, sl.date].filter(Boolean).join(' ');
  setTimeout(()=>{ window.print(); document.title=old; }, 50);
}

function renderMembers(){

  const uses = n => S.songs.filter(s=>s.vox.includes(n)).length;
  el.innerHTML = m.map((n,i)=>`<div class="row"><input data-mi="${i}" value="${esc(n)}"><span class="muted" style="align-self:center;width:70px">${uses(n)} songs</span><button class="ib" data-mup="${i}" title="Move up" ${i?'':'disabled'}>↑</button><button class="ib" data-mrm="${i}" title="Remove">×</button></div>`).join('') || '<span class="muted">No members yet.</span>';
  const swap = (vox, a, b) => vox.map(x=>x===a?b:x).filter((x,i,arr)=>arr.indexOf(x)===i);
  $$('[data-mi]',el).forEach(inp=>inp.onchange=()=>{
    const i=+inp.dataset.mi, old=m[i], nw=inp.value.trim();
    if(!nw || nw===old) { inp.value=old; return; }
    if(m.includes(nw) || nw==='All'){ alert(`"${nw}" already exists.`); inp.value=old; return; }
    m[i]=nw; S.songs.forEach(s=>s.vox=swap(s.vox,old,nw)); S.setlists.forEach(sl=>{ sl.items.forEach(it=>{ if(it.vox) it.vox=swap(it.vox,old,nw); }); if(sl.out) sl.out=sl.out.map(x=>x===old?nw:x); });

function parseCsv(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(f); f=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=ch; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function importCsv(text){
  const rows=parseCsv(text); if(rows.length<2) return 'No rows found.';
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col = (...names) => h.findIndex(x=>names.includes(x));
  const ai=col('artist','original artist','performer','band'), ti=col('title','song','name'), vi=col('lead vocals','lead vox','vox','vocals','singer'), ki=col('key'), li=col('length','duration','time'), bi=col('tempo','bpm'), ni=col('notes','note'), gi=col('tags','tag');
  if(ti<0) return 'Could not find a "title" column.';
  const have=new Set(S.songs.map(s=>s.title.trim().toLowerCase())); let added=0, skipped=0, filled=0;
  rows.slice(1).forEach(r=>{ const t=(r[ti]||'').trim(); if(!t) return;
    if(have.has(t.toLowerCase())){
      // already in the catalog: only fill in a blank artist, never overwrite anything
      const ex=S.songs.find(s=>s.title.trim().toLowerCase()===t.toLowerCase()), a=ai>=0?(r[ai]||'').trim():'';
      if(ex && ex.type!=='mashup' && a && !(ex.artist||'').trim()){ ex.artist=a; filled++; } else skipped++;
      return; }
    S.songs.push(newSong({title:t, artist:ai>=0?(r[ai]||'').trim():'', vox:vi>=0?parseVox(r[vi]):[], key:ki>=0?(r[ki]||'').trim():'', length:li>=0?parseLen(r[li]):null, tempo:bi>=0?numOrNull(r[bi]):null, notes:ni>=0?(r[ni]||'').trim():'', tags:gi>=0?parseTags((r[gi]||'').replace(/;/g,',')):[]}));
    have.add(t.toLowerCase()); added++; });
  S.songs.flatMap(s=>s.vox).forEach(v=>{ if(v!=='All' && !S.settings.members.includes(v)) S.settings.members.push(v); });
  save(); return `Added ${added} song${added===1?'':'s'}${filled?`, filled in the artist on ${filled}`:''}, skipped ${skipped} already in the catalog.`;
}

/* ---------- Spotify ---------- */
/* Authorization Code with PKCE straight from the browser: no server, no secret. The Client ID
   lives in the band file; the sign-in tokens stay in this browser only. Each catalog song keeps
   its matched track (song.spotify), so matching happens once. */
const SP_KEY='setlist-builder-spotify', SP_SCOPES='user-read-private playlist-modify-public playlist-modify-private';
const spRedirect = () => location.origin + location.pathname.replace(/[^/]*$/,'');   // the folder; index.html forwards to the app
const spCanAuth = () => location.protocol==='https:' || /^http:\/\/(127\.0\.0\.1|\[::1\])(:\d+)?$/.test(location.origin);
function spTok(){ try{ return JSON.parse(localStorage.getItem(SP_KEY)||'null'); }catch(e){ return null; } }
function spSetTok(t){ try{ t ? localStorage.setItem(SP_KEY, JSON.stringify(t)) : localStorage.removeItem(SP_KEY); }catch(e){} }
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
class SpErr extends Error { constructor(m, status){ super(m); this.status=status; } }

async function spConnect(){
  const cid=(S.settings.spotify.clientId||'').trim();
  if(!spCanAuth()){ alert('Spotify sign-in needs the app opened from a web address, not a file. See Band settings → Spotify.'); return; }
  if(!cid){ alert('Add your Spotify app Client ID in Band settings → Spotify first.'); closeModal(); go('settings'); return; }
  const ver=b64url(crypto.getRandomValues(new Uint8Array(48))), state=b64url(crypto.getRandomValues(new Uint8Array(16)));
  const challenge=b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ver)));
  sessionStorage.setItem('sp-pkce', JSON.stringify({ver, state, view, curId}));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code', client_id:cid, redirect_uri:spRedirect(), scope:SP_SCOPES, code_challenge_method:'S256', code_challenge:challenge, state});
}
function spDisconnect(){ spSetTok(null); }
async function spToken(body){
  const r=await fetch('https://accounts.spotify.com/api/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new SpErr(j.error_description||j.error||('HTTP '+r.status), j.error==='invalid_grant'?401:r.status);
  const old=spTok()||{};
  const t={access:j.access_token, refresh:j.refresh_token||old.refresh, exp:Date.now()+((j.expires_in||3600)-60)*1000, user:old.user};
  spSetTok(t); return t;
}
async function spAccess(force){
  const t=spTok(); if(!t) throw new SpErr('Not connected to Spotify.', 401);
  if(!force && Date.now()<t.exp) return t.access;
  try{ return (await spToken({grant_type:'refresh_token', refresh_token:t.refresh, client_id:S.settings.spotify.clientId})).access; }
  catch(e){ if(e.status===401||e.status===400) spSetTok(null); throw new SpErr('Your Spotify sign-in expired. Connect again.', 401); }
}
async function spApi(path, opt={}, tries=0){
  const tok=await spAccess(tries>0 && opt._retry401);
  const r=await fetch('https://api.spotify.com/v1'+path, {method:opt.method||'GET', headers:{Authorization:'Bearer '+tok, ...(opt.body?{'Content-Type':'application/json'}:{})}, body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401 && tries<1) return spApi(path, {...opt, _retry401:true}, tries+1);
  if(r.status===429 && tries<4){ const w=+(r.headers.get('Retry-After')||2); await new Promise(f=>setTimeout(f, Math.min(w,30)*1000)); return spApi(path, opt, tries+1); }
  if(r.status===204) return null;
  const j=await r.json().catch(()=>null);
  if(!r.ok){
    let m=(j&&j.error&&(j.error.message||j.error))||('HTTP '+r.status);
    if(r.status===403) m+=' — Spotify refused this. Make sure you are added under User Management in the Spotify app, and that its owner has Premium.';
    throw new SpErr(m, r.status);
  }
  return j;
}
async function spHandleRedirect(){
  const q=new URLSearchParams(location.search); if(!q.has('code') && !q.has('error')) return;
  let p=null; try{ p=JSON.parse(sessionStorage.getItem('sp-pkce')); }catch(e){}
  sessionStorage.removeItem('sp-pkce');
  history.replaceState(null, '', location.pathname+location.hash);
  if(!S) return;
  if(q.get('error') || !p || q.get('state')!==p.state){ alert('Spotify sign-in was cancelled or did not complete.'); return; }
  try{
    await spToken({client_id:S.settings.spotify.clientId, grant_type:'authorization_code', code:q.get('code'), redirect_uri:spRedirect(), code_verifier:p.ver});
    const me=await spApi('/me'); const t=spTok(); t.user=me.display_name||me.id; spSetTok(t);
  }catch(e){ alert('Spotify sign-in failed: '+e.message); return; }
  if(p.view==='builder' && S.setlists.some(x=>x.id===p.curId)){ go('builder', p.curId); openSpotify(); }
  else render();
}
function renderSpStat(el, after){
  if(!el) return; const t=spTok();
  el.innerHTML = t ? `<span>✓ Connected to Spotify${t.user?` as <b>${esc(t.user)}</b>`:''}</span><button class="btn" data-spoff>Disconnect</button>`
                   : `<button class="btn primary" data-spon ${spCanAuth()&&S.settings.spotify.clientId?'':'disabled'}>Connect Spotify</button>${S.settings.spotify.clientId?'':'<span class="muted">Add the Client ID first (Band settings → Spotify).</span>'}`;
  $('[data-spon]',el)?.addEventListener('click', spConnect);
  $('[data-spoff]',el)?.addEventListener('click', ()=>{ spDisconnect(); renderSpStat(el, after); after&&after(); });
}

/* matching */
const spTrack = t => ({id:t.id, uri:t.uri, name:t.name, artists:(t.artists||[]).map(a=>a.name).join(', '), album:t.album?.name||'', year:(t.album?.release_date||'').slice(0,4), url:t.external_urls?.spotify||''});
async function spSearch(q){ const j=await spApi('/search?'+new URLSearchParams({q, type:'track', limit:'10'})); return (j?.tracks?.items||[]).filter(Boolean).map(spTrack); }
const spNorm = x => String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^the\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
const spBaseTitle = s => s.title.replace(/\s*\([^)]*\)\s*$/,'').trim() || s.title;
async function spAutoMatch(s){
  const title=spBaseTitle(s);
  let r = s.artist ? await spSearch(`track:"${title.replace(/"/g,'')}" artist:"${s.artist.replace(/"/g,'')}"`) : [];
  if(!r.length) r = await spSearch(`${title} ${s.artist||''}`.trim());
  if(!r.length) return null;
  const nt=spNorm(title), na=spNorm(s.artist);
  const score = t => (na && spNorm(t.artists).includes(na) ? 2 : 0) + (spNorm(t.name).startsWith(nt) ? 1 : 0);
  return r.reduce((best,t)=>score(t)>score(best)?t:best, r[0]);
}
/* playlist order: every song slot in set order; a mashup adds its catalog parts */
function spEntries(sl){
  const out=[];
  sl.items.forEach(it=>{
    if(it.kind==='break') return;
    const s=songById(it.songId); if(!s) return;
    if(s.type==='mashup') (s.parts||[]).forEach(pid=>{ const ps=typeof pid==='string'?songById(pid):null; if(ps) out.push({s:ps, via:s}); });
    else out.push({s});
  });
  return out;
}

    <div class="spstat" id="spS"></div>
    <div id="spBody"></div>`, true);
  const body=$('#spBody');
  const draw = () => {
    renderSpStat($('#spS'), draw);
    const E=spEntries(sl), uniq=[...new Map(E.map(e=>[e.s.id,e.s])).values()];
    const un=uniq.filter(s=>!s.spotify), auto=uniq.filter(s=>s.spotify&&s.spotify.auto), ok=E.filter(e=>e.s.spotify&&e.s.spotify.uri).length;
    const conn=!!spTok(), pl=sl.spotify;
    body.innerHTML = `
      ${spCanAuth()?'':`<p class="spwarn">Spotify sign-in only works when this app is opened from a web address (https, or http://127.0.0.1), not as a file. See Band settings → Spotify.</p>`}
      <div class="g3" style="grid-template-columns:2fr 1fr 1fr;align-items:end">
        <label>Playlist name<input id="spName" value="${esc((pl&&pl.name)||defName)}"></label>
        <label class="opt" style="margin-bottom:12px !important"><input type="checkbox" id="spPub" ${(pl?pl.public:true)!==false?'checked':''}> Public (bandmates can open the link)</label>
        <div style="margin-bottom:10px;text-align:right">${pl&&pl.url?`<a href="${esc(pl.url)}" target="_blank" rel="noopener">Open current playlist ↗</a>`:''}</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="spMatch" ${conn&&un.length&&!st.busy?'':'disabled'}>Find matches for ${un.length} song${un.length===1?'':'s'}</button>
        <span class="grow"></span>
        <span class="muted">${ok} of ${E.length} tracks matched${auto.length?` · ${auto.length} auto-matched, worth a glance`:''}</span>
        ${pl&&pl.id?`<button class="btn" id="spNew" ${conn&&ok&&!st.busy?'':'disabled'}>Create a new playlist</button><button class="btn primary" id="spUpd" ${conn&&ok&&!st.busy?'':'disabled'}>Update playlist</button>`
                   :`<button class="btn primary" id="spNew" ${conn&&ok&&!st.busy?'':'disabled'}>Create playlist</button>`}
      </div>
      <p id="spMsg" class="muted" style="min-height:1.2em">${st.msg}</p>
      <table class="sptable"><tbody>${E.map((e,i)=>{
        const s=e.s, m=s.spotify;
        const stat = !m ? '<span class="none">Not matched yet</span>'
          : m.none ? '<span class="none">Not on Spotify (skipped)</span>'
          : `<span class="${m.auto?'auto':'ok'}">${m.auto?'≈':'✓'} ${esc(m.name)}</span> <span class="sa">— ${esc(m.artists)}${m.album?` · ${esc(m.album)}`:''}${m.year?` (${m.year})`:''}</span>${m.url?` <a href="${esc(m.url)}" target="_blank" rel="noopener" title="Open in Spotify">↗</a>`:''}`;
        const find = st.open===s.id ? `<div class="spfind"><div class="row"><input id="spQ" value="${esc(spBaseTitle(s)+' '+(s.artist||''))}"><button class="btn" id="spGo">Search</button></div><div class="spres" id="spRes"><span class="muted">Searching…</span></div></div>` : '';
        return `<tr><td class="n">${i+1}</td><td><b>${esc(s.title)}</b>${e.via?` <span class="sa">(in ${esc(e.via.title)})</span>`:''}<div class="sa">${esc(s.artist||'no artist')}</div></td>
          <td>${stat}${find}</td>
          <td class="acts">${m&&m.auto?`<button class="btn" data-spok="${s.id}" title="This is the right recording">Looks right</button> `:''}<button class="btn" data-spch="${s.id}" ${conn?'':'disabled'}>${m&&!m.none?'Change':'Find'}</button> <button class="btn" data-spnone="${s.id}" title="Skip this song in playlists">${m&&m.none?'Undo skip':'Skip'}</button></td></tr>`;
      }).join('') || '<tr><td class="empty">No songs in this setlist yet.</td></tr>'}</tbody></table>`;
    $('#spName').onchange=e=>{ if(sl.spotify) { sl.spotify.name=e.target.value.trim(); touch(); } };
    $('#spMatch').onclick=matchAll;
    $('#spNew').onclick=()=>exportPl(false);
    $('#spUpd')&&($('#spUpd').onclick=()=>exportPl(true));
    $$('[data-spok]',body).forEach(b=>b.onclick=()=>{ delete songById(b.dataset.spok).spotify.auto; save(); draw(); });
    $$('[data-spnone]',body).forEach(b=>b.onclick=()=>{ const s=songById(b.dataset.spnone); s.spotify = s.spotify&&s.spotify.none ? null : {none:true}; if(!s.spotify) delete s.spotify; save(); draw(); });
    $$('[data-spch]',body).forEach(b=>b.onclick=()=>{ st.open = st.open===b.dataset.spch ? null : b.dataset.spch; draw(); if(st.open) runFind(); });
    if(st.open){ $('#spGo').onclick=runFind; $('#spQ').onkeydown=e=>{ if(e.key==='Enter') runFind(); }; }
  };
  const say = m => { st.msg=m; const el=$('#spMsg'); if(el) el.innerHTML=m; };
  async function runFind(){
    const s=songById(st.open), box=$('#spRes'); if(!s||!box) return;
    box.innerHTML='<span class="muted">Searching…</span>';
    try{
      const r=await spSearch($('#spQ').value.trim());
      box.innerHTML = r.map((t,i)=>`<button data-pick="${i}"><span><b>${esc(t.name)}</b> <span class="sa">— ${esc(t.artists)}</span></span><span class="sa">${esc(t.album)}${t.year?` (${t.year})`:''}</span></button>`).join('') || '<span class="muted">No results. Try different words.</span>';
      $$('[data-pick]',box).forEach(b=>b.onclick=()=>{ s.spotify=r[+b.dataset.pick]; st.open=null; save(); draw(); });
    }catch(e){ box.innerHTML=`<span class="muted">${esc(e.message)}</span>`; if(e.status===401) draw(); }
  }
  async function matchAll(){
    const todo=[...new Map(spEntries(sl).map(e=>[e.s.id,e.s])).values()].filter(s=>!s.spotify);
    st.busy=true; draw(); let found=0, missing=0;
    try{
      for(let i=0;i<todo.length;i++){
        say(`Searching Spotify… ${i+1} of ${todo.length}`);
        const t=await spAutoMatch(todo[i]);
        if(t){ todo[i].spotify={...t, auto:true}; found++; } else missing++;
      }
      say(`Matched ${found}${missing?`; ${missing} not found — use Find to search by hand, or Skip`:''}. Auto-matches (≈) are the top search result, so give them a quick look.`);
    }catch(e){ say(`Stopped: ${esc(e.message)}`); }
    st.busy=false; save(); draw();
  }
  async function exportPl(update){
    const uris=spEntries(sl).map(e=>e.s.spotify).filter(m=>m&&m.uri).map(m=>m.uri);
    const name=$('#spName').value.trim()||defName, pub=$('#spPub').checked;
    st.busy=true; draw(); say(update?'Updating the playlist…':'Creating the playlist…');
    try{
      let id=update&&sl.spotify?sl.spotify.id:null;
      if(update){
        try{ await spApi(`/playlists/${id}/items`, {method:'PUT', body:{uris:uris.slice(0,100)}}); }
        catch(e){ if(e.status===404){ id=null; } else throw e; }
        if(id) try{ await spApi(`/playlists/${id}`, {method:'PUT', body:{name, public:pub}}); }catch(e){}   // renaming is best effort
      }
      const fresh=!id;
      if(fresh){
        const p=await spApi('/me/playlists', {method:'POST', body:{name, public:pub, description:`${S.band.name} setlist${sl.venue?` · ${sl.venue}`:''}${sl.date?` · ${fmtDate(sl.date)}`:''}. Made with Setlist Builder.`}});
        id=p.id; sl.spotify={id, url:p.external_urls?.spotify||`https://open.spotify.com/playlist/${id}`};
      }
      for(let i=fresh?0:100; i<uris.length; i+=100) await spApi(`/playlists/${id}/items`, {method:'POST', body:{uris:uris.slice(i,i+100)}});
      Object.assign(sl.spotify, {name, public:pub, synced:Date.now()}); touch();
      const skipped=spEntries(sl).length-uris.length;
      say(`${fresh?'Created':'Updated'} “${esc(name)}” with ${uris.length} track${uris.length===1?'':'s'}${skipped?` (${skipped} not matched or skipped)`:''}. <a href="${esc(sl.spotify.url)}" target="_blank" rel="noopener">Open in Spotify ↗</a>`);
    }catch(e){ say(`Couldn't ${update?'update':'create'} the playlist: ${esc(e.message)}`); }
    st.busy=false; draw();
  }
  draw();
}

/* ---------- boot ---------- */
load();
render();
spHandleRedirect();
</script>
</body>
</html>
